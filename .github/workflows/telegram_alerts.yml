name: Gold AI Telegram Alerts

# Forward paper trading of the single macro rule (signal_rules.ACTIVE_RULE_KEY).
# Every COMPLETED session (18:00 → 17:00 New York) is processed exactly once;
# Telegram messages only when a paper trade OPENS or CLOSES (or data goes stale).
# Sessions close at 21:00/22:00 UTC; the 02:30 UTC run (08:00 IST) sends the
# session that just closed. The 04:30 UTC run is a backup in case
# GitHub drops a scheduled run — dedup (state/notifier_state.json) makes it a
# no-op when the alert was already sent. Weekend runs are also no-ops.
on:
  schedule:
    - cron: '30 2 * * *'
    - cron: '30 4 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = process new sessions | dry-run = print only | status = send paper-trade status | test = send TEST status'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - dry-run
          - status
          - test

permissions:
  contents: write

concurrency:
  group: gold-ai-telegram
  cancel-in-progress: false

jobs:
  send-telegram-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pandas==2.3.3 numpy==2.4.2 requests==2.32.5 yfinance==1.2.0

      - name: Refresh market data and sessions
        id: refresh
        continue-on-error: true   # if this fails the notifier's stale-data guard alerts instead
        run: python refresh_data.py

      - name: Verify live/batch session parity
        run: python verify_parity.py 30

      - name: Run Gold AI Telegram Notifier
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}"
          echo "Mode: $MODE"
          case "$MODE" in
            dry-run) python signal_notifier.py --auto --no-refresh --dry-run ;;
            test)    python signal_notifier.py --auto --no-refresh --test ;;
            status)  python signal_notifier.py --auto --no-refresh --status ;;
            *)       python signal_notifier.py --auto --no-refresh ;;
          esac

      - name: Commit refreshed data and dedup state
        if: always()
        run: |
          git config user.name  "gold-ai-bot"
          git config user.email "gold-ai-bot@users.noreply.github.com"
          git add data/gold_15m_full.csv data/uup_1d.csv data/ief_1d.csv data/session_regime_v2.csv
          if [ -f state/notifier_state.json ]; then git add state/notifier_state.json; fi
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: refresh session data and notifier state [skip ci]"
            git pull --rebase --autostash
            git push
          fi
